<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Nesne Tespit">
  <title>Nesne Tespit</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="stage">
    <video id="video" playsinline muted autoplay></video>
    <canvas id="overlay"></canvas>

    <header id="topbar">
      <div id="stats"><span id="fps">-- FPS</span><span id="infer">-- ms</span><span id="backend">…</span></div>
      <div class="right">
        <button id="modeBtn" class="pill" aria-label="Model modu">…</button>
        <button id="langBtn" class="pill" aria-label="Dil değiştir">TR</button>
      </div>
    </header>

    <div id="toast"></div>

    <footer id="controls">
      <div id="count" class="pill">0 nesne</div>
      <button id="flipBtn" class="round" aria-label="Ön/arka kamera değiştir">
        <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h3l2-3h8l2 3h3v13H3z"/><path d="M9 13a3 3 0 0 1 5.2-2"/><path d="M15 13a3 3 0 0 1-5.2 2"/><path d="M14 9v2h2"/><path d="M10 17v-2H8"/></svg>
      </button>
      <button id="confBtn" class="pill" aria-label="Güven eşiği">≥ 35%</button>
    </footer>

    <section id="splash">
      <h1>Nesne Tespit</h1>
      <p id="status">Model yükleniyor…</p>
      <div id="bar"><div id="barFill"></div></div>
      <button id="startBtn" hidden>Kamerayı Başlat</button>
      <small>YOLO26 · tam COCO ile eğitilmiş · 80 nesne sınıfı · Tamamen cihaz üzerinde</small>
    </section>
  </main>
  <script src="vendor/ort.webgpu.min.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
