name: GitHub Pages - Nesne Tespit

on:
  push:
    branches: [main, ccr-f3345bf9-3evt3o]
    paths: ["nesne-tespit/web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: nesne-tespit/web
      - id: deployment
        uses: actions/deploy-pages@v4
